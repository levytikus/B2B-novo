# Baixa para previas/<pasta>/img/ as artes exportadas do Canva.
# Usado pelo Claude ao montar as prévias: o ambiente dele não alcança os servidores
# do Canva, então quem baixa os arquivos é o GitHub. Não altera mais nada no site.
name: Baixar artes da prévia

on:
  workflow_dispatch:
    inputs:
      pasta:
        description: 'Pasta da prévia dentro de previas/ (ex.: jardim-escola-belo-jasmim)'
        required: true
      arquivos:
        description: 'JSON: [{"nome":"hero.jpg","url":"https://..."}] (só links do Canva)'
        required: true

permissions:
  contents: write

concurrency: baixar-artes

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar arquivos
        env:
          PASTA: ${{ inputs.pasta }}
          ARQUIVOS: ${{ inputs.arquivos }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.parse
          pasta = os.environ["PASTA"]
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]{1,80}", pasta):
              sys.exit("pasta inválida")
          destino = os.path.join("previas", pasta, "img")
          os.makedirs(destino, exist_ok=True)
          for item in json.loads(os.environ["ARQUIVOS"]):
              nome, url = item["nome"], item["url"]
              if not re.fullmatch(r"[a-z0-9][a-z0-9-]{0,60}\.(jpg|jpeg|png|webp)", nome):
                  sys.exit(f"nome inválido: {nome}")
              host = urllib.parse.urlparse(url).hostname or ""
              if not url.startswith("https://") or not (host == "canva.com" or host.endswith(".canva.com")):
                  sys.exit(f"link fora do Canva: {host}")
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  dados = r.read()
              if len(dados) > 25 * 1024 * 1024:
                  sys.exit(f"arquivo grande demais: {nome}")
              with open(os.path.join(destino, nome), "wb") as f:
                  f.write(dados)
              print(nome, len(dados), "bytes")
          PY
      - name: Gravar no repositório
        env:
          PASTA: ${{ inputs.pasta }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "previas/$PASTA/img"
          git diff --cached --quiet && { echo "nada novo"; exit 0; }
          git commit -m "Artes do Canva para a prévia $PASTA"
          git pull --rebase origin main
          git push origin HEAD:main
